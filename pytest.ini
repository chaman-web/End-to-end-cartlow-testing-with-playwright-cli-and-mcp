[pytest]
testpaths = tests

# ── Output ─────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers

# ── Markers ────────────────────────────────────────────────────────────────────
markers =
    smoke:       Fast sanity checks — run on every commit
    regression:  Full regression suite
    p0:          Priority 0 — must pass before release
    p1:          Priority 1 — high importance
    p2:          Priority 2 — nice to have
    auth:        Authentication and registration tests
    homepage:    Homepage tests
    search:      Search functionality tests
    pdp:         Product Detail Page tests
    gift_card:   Gift card specific tests
    cart:        Shopping cart tests
    checkout:    Checkout page tests
    payment:     Payment method tests
    e2e:         End-to-end full journey tests
    intl:        INTL channel tests
    uae:         UAE channel tests
    ksa:         KSA channel tests
    staging:     Staging environment only
    production:  Production environment only

# ── Timeouts ───────────────────────────────────────────────────────────────────
timeout = 300
